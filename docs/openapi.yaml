          type: string
        requests:
          type: integer
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cost:
          type: number
          minimum: 0
        average_latency_ms:
          type: number
    AuditRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        resource:
          type: string
        status_code:
          type: integer
          minimum: 0
          maximum: 599
          description: Zero for intent records; HTTP status for outcome records
        request_id:
          type:
          - string
          - 'null'
          format: uuid
    UpstreamAttempt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        provider:
          type: string
        model:
          type: string
        provider_key_id:
          type:
          - string
          - 'null'
          pattern: '^key_[a-f0-9]{32}$'
          description: Stable upstream credential fingerprint (first 128 bits of SHA-256); null for historical, identity/keyless or non-HTTP attempts. Never contains the raw API key.
        provider_request_id:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        latency_ms:
          type: integer
        status:
          type: string
        http_status:
          type:
          - integer
          - 'null'
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cached_input_tokens:
          type: integer
        cache_creation_tokens:
          type: integer
        usage_estimated:
          type: boolean
        estimated_cost:
          type: number
          minimum: 0
        actual_cost:
          type:
          - number
          - 'null'
          minimum: 0
    ReconciliationInput:
