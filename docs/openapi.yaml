openapi: 3.1.0
info:
  title: LLMProxy
  version: 0.3.0
  description: OpenAI-compatible inference gateway with capability routing, local operator roles, accounting, reports and durable batches. See api.md and expanded-api.md for compatibility boundaries.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:4000
security:
  - gatewayKey: []
paths:
  /v1/models:
    get:
      operationId: listModels
      summary: List permitted and configured public model aliases
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { type: string, const: list }
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, object, created, owned_by]
                      properties:
                        id: { type: string }
                        object: { type: string, const: model }
                        created: { type: integer }
                        owned_by: { type: string, const: llmproxy }
        '401': { $ref: '#/components/responses/OpenAiError' }
        '429': { $ref: '#/components/responses/OpenAiError' }
        '503': { $ref: '#/components/responses/OpenAiError' }
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Create a normal or streamed chat completion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: Completion or SSE stream. In-stream errors have an error event and no successful DONE marker.
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCompletion' }
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/OpenAiError' }
        '401': { $ref: '#/components/responses/OpenAiError' }
        '403': { $ref: '#/components/responses/OpenAiError' }
        '404': { $ref: '#/components/responses/OpenAiError' }
        '413': { $ref: '#/components/responses/OpenAiError' }
        '415': { $ref: '#/components/responses/OpenAiError' }
        '429': { $ref: '#/components/responses/OpenAiError' }
        '500': { $ref: '#/components/responses/OpenAiError' }
        '502': { $ref: '#/components/responses/OpenAiError' }
        '503': { $ref: '#/components/responses/OpenAiError' }
        '504': { $ref: '#/components/responses/OpenAiError' }
  /admin/keys:
    get:
      operationId: listApiKeys
      x-required-roles: [administrator, operator, auditor]
      summary: List gateway key metadata, without raw keys or hashes
      security: [{ adminKey: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Key metadata
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKeySummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createApiKey
      x-required-roles: [administrator, operator]
      summary: Create a gateway key and disclose its raw value once
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/KeyPolicy'
                - type: object
                  required: [owner]
                  properties:
                    owner: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '201':
          description: Newly created credential. Store the key securely; it cannot be recovered later.
          content:
            application/json:
              schema:
                type: object
                required: [key, details]
                properties:
                  key: { type: string, pattern: '^llmp_sk_[A-Za-z0-9_-]+$' }
                  details: { $ref: '#/components/schemas/ApiKeySummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/keys/{id}:
    put:
      operationId: replaceApiKeyPolicy
      x-required-roles: [administrator, operator]
      summary: Replace a key policy while preserving ownership and consumption
      security: [{ adminKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/KeyPolicy'
                - type: object
                  required: [enabled]
                  properties:
                    enabled: { type: boolean }
      responses:
        '200':
          description: Updated metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeySummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/usage:
    get:
      operationId: listUsage
      x-required-roles: [administrator, operator, auditor]
      summary: List recent admitted completion records
      security: [{ adminKey: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: api_key_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Usage in descending creation order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UsageRecord' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/Health' }
  /health/live:
    get:
      operationId: liveness
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /health/ready:
    get:
      operationId: readiness
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/Health' }
  /v1/embeddings:
    post:
      operationId: createEmbeddings
      summary: Create embeddings with input-only accounting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingList'
        default:
          $ref: '#/components/responses/OpenAiError'
  /v1/responses:
    post:
      operationId: createResponse
      summary: Create a stateless normal or streamed Responses result
      description: OpenAI and Foundry only. Native SSE lifecycle events are preserved; there is no Chat Completions
        DONE marker. Never replays after the first event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponseRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/OpenAiError'
  /v1/files:
    get:
      operationId: listFiles
      summary: List files owned by this gateway key
      parameters:
      - name: after
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileList'
        default:
          $ref: '#/components/responses/OpenAiError'
    post:
      operationId: uploadBatchFile
      summary: Upload a UTF-8 JSONL batch input file
      description: Default maximum 10 MiB. File ownership follows the gateway key ID; file content is persisted subject
        to retention.
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayFile'
        default:
          $ref: '#/components/responses/OpenAiError'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - purpose
              - file
              properties:
                purpose:
                  type: string
                  const: batch
                file:
                  type: string
                  format: binary
  /v1/files/{id}:
    get:
      operationId: retrieveFile
      summary: Retrieve owned file metadata
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayFile'
        default:
          $ref: '#/components/responses/OpenAiError'
    delete:
      operationId: deleteFile
      summary: Delete an owned file; active batch inputs return 409
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - object
                - deleted
                properties:
                  id:
                    type: string
                  object:
                    type: string
                    const: file
                  deleted:
                    type: boolean
                    const: true
        default:
          $ref: '#/components/responses/OpenAiError'
  /v1/files/{id}/content:
    get:
      operationId: retrieveFileContent
      summary: Download owned file contents
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/jsonl:
              schema:
                type: string
        default:
          $ref: '#/components/responses/OpenAiError'
  /v1/batches:
    get:
      operationId: listBatches
      summary: List batches owned by this gateway key
      parameters:
      - name: after
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchList'
        default:
          $ref: '#/components/responses/OpenAiError'
    post:
      operationId: createBatch
      summary: Queue durable nonstreaming requests for gateway workers
      description: Default 1,000 items. Each item receives normal permissions, RPM, concurrency and quota checks.
        No native provider batch discount. Lost running work is marked interrupted, never automatically replayed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatch'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        default:
          $ref: '#/components/responses/OpenAiError'
  /v1/batches/{id}:
    get:
      operationId: retrieveBatch
      summary: Retrieve owned batch status and result file IDs
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        default:
          $ref: '#/components/responses/OpenAiError'
  /v1/batches/{id}/cancel:
    post:
      operationId: cancelBatch
      summary: Cancel pending work and wait for running items to finish
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        default:
          $ref: '#/components/responses/OpenAiError'
  /admin:
    get:
      operationId: dashboard
      summary: Embedded operator console
      security: []
      responses:
        '200':
          description: Successful response
          content:
            text/html:
              schema:
                type: string
  /admin/auth/login:
    post:
      operationId: loginOperator
      summary: Create an eight-hour local operator session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorLogin'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorSession'
        default:
          $ref: '#/components/responses/Problem'
  /admin/auth/me:
    get:
      operationId: currentOperator
      summary: Read the current administrative identity
      security:
      - adminKey: []
      x-required-roles:
      - administrator
      - operator
      - auditor
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  username:
                    type: string
                  role:
                    type: string
                    enum:
                    - administrator
                    - operator
                    - auditor
        default:
          $ref: '#/components/responses/Problem'
  /admin/auth/logout:
    post:
      operationId: logoutOperator
      summary: Revoke the current local session
      description: Shared bootstrap secrets are not revoked by logout.
      security:
      - adminKey: []
      x-required-roles:
      - administrator
      - operator
      - auditor
      responses:
        '204':
          description: Successful response
        default:
          $ref: '#/components/responses/Problem'
  /admin/operators:
    get:
      operationId: listOperators
      summary: List local operators without password hashes
      security:
      - adminKey: []
      x-required-roles:
      - administrator
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Operator'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createOperator
      summary: Create a local operator
      security:
      - adminKey: []
      x-required-roles:
      - administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOperator'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operator'
        default:
          $ref: '#/components/responses/Problem'
  /admin/operators/{id}:
    put:
      operationId: updateOperator
      summary: Update a local operator and revoke existing sessions
      description: The last enabled local administrator cannot be disabled or demoted.
      security:
      - adminKey: []
      x-required-roles:
      - administrator
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOperator'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operator'
        default:
          $ref: '#/components/responses/Problem'
  /admin/keys/{id}/rotate:
    post:
      operationId: rotateApiKey
      summary: Rotate a credential while preserving its key ID and counters
      description: Only the current and immediately previous credentials can remain valid. The new key is disclosed
        once.
      security:
      - adminKey: []
      x-required-roles:
      - administrator
      - operator
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grace_seconds:
                  type: integer
                  minimum: 0
                  maximum: 86400
                  default: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiKey'
        default:
          $ref: '#/components/responses/Problem'
  /admin/keys/page:
    get:
      operationId: pageApiKeys
      summary: Page key metadata by exact owner
      security:
      - adminKey: []
      x-required-roles:
      - administrator
      - operator
      - auditor
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: owner
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyPage'
        default:
          $ref: '#/components/responses/Problem'
  /admin/keys/{id}/quotas:
    get:
      operationId: listQuotaWindows
      summary: Read up to 120 UTC monthly quota windows
      security:
      - adminKey: []
      x-required-roles:
      - administrator
      - operator
      - auditor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuotaWindow'
        default:
          $ref: '#/components/responses/Problem'
  /admin/usage/page:
    get:
      operationId: pageUsage
      summary: Page retained usage with stable timestamp and ID ordering
      security:
      - adminKey: []
      x-required-roles:
      - administrator
      - operator
      - auditor
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: api_key_id
        in: query
        schema:
          type: string
          format: uuid
      - name: owner
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date-time
        description: Inclusive timestamp
      - name: to
        in: query
        schema:
          type: string
          format: date-time
        description: Exclusive timestamp
      - name: model
        in: query
        schema:
          type: string
      - name: provider
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum:
          - success
          - error
          - cancelled
          - abandoned
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsagePage'
        default:
          $ref: '#/components/responses/Problem'
  /admin/usage/summary:
    get:
      operationId: summarizeUsage
      summary: Aggregate all matching retained usage by model and provider
      security:
      - adminKey: []
      x-required-roles:
      - administrator
      - operator
      - auditor
      parameters:
      - name: api_key_id
        in: query
        schema:
          type: string
          format: uuid
      - name: owner
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date-time
        description: Inclusive timestamp
      - name: to
        in: query
        schema:
          type: string
          format: date-time
        description: Exclusive timestamp
      - name: model
        in: query
        schema:
          type: string
      - name: provider
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum:
          - success
          - error
          - cancelled
          - abandoned
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsageRollup'
        default:
          $ref: '#/components/responses/Problem'
  /admin/usage/export:
    get:
      operationId: exportUsage
      summary: Stream matching usage as CSV across all pages
      security:
      - adminKey: []
      x-required-roles:
      - administrator
      - operator
      - auditor
      parameters:
      - name: api_key_id
        in: query
        schema:
          type: string
          format: uuid
      - name: owner
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date-time
        description: Inclusive timestamp
      - name: to
        in: query
        schema:
          type: string
          format: date-time
        description: Exclusive timestamp
      - name: model
        in: query
        schema:
          type: string
      - name: provider
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum:
          - success
          - error
          - cancelled
          - abandoned
      responses:
        '200':
          description: Successful response
          content:
            text/csv:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /admin/usage/{id}/attempts:
    get:
      operationId: listUpstreamAttempts
      summary: List recorded HTTP attempts for a request
      security:
      - adminKey: []
      x-required-roles:
      - administrator
      - operator
      - auditor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpstreamAttempt'
        default:
          $ref: '#/components/responses/Problem'
  /admin/audit:
    get:
      operationId: pageAudit
      summary: Page management intent/outcome and rejected-request audit records
      security:
      - adminKey: []
      x-required-roles:
      - administrator
      - operator
      - auditor
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        default:
          $ref: '#/components/responses/Problem'
  /admin/billing/reconcile:
    post:
      operationId: reconcileInvoice
      summary: Atomically reconcile provider attempt costs
      description: Identical imports are idempotent. Conflicting attempt IDs or references return 409. Adjusts request
        and lifetime/original-month costs; retained usage is required.
      security:
      - adminKey: []
      x-required-roles:
      - administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ReconciliationInput'
              minItems: 1
              maxItems: 1000
      responses:
        '204':
          description: Successful response
        default:
          $ref: '#/components/responses/Problem'
  /admin/config/reload:
    post:
      operationId: reloadConfiguration
      summary: Validate and replace model, pricing and account catalogs
      description: Invalid configuration returns 400 and preserves the active catalog. Applies per instance. Process
        settings require restart; in-flight routes retain captured providers and prices.
      security:
      - adminKey: []
      x-required-roles:
      - administrator
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  generation:
                    type: integer
                  models:
                    type: integer
                  providers:
                    type: integer
        default:
          $ref: '#/components/responses/Problem'
  /admin/models:
    get:
      operationId: listManagedModels
      summary: List model routing and effective target feature flags
      security:
      - adminKey: []
      x-required-roles:
      - administrator
      - operator
      - auditor
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    routing:
                      type: string
                    max_concurrent_requests:
                      type: integer
                    targets:
                      type: array
                      items:
                        type: object
                        properties:
                          provider:
                            type: string
                          model:
                            type: string
                          capabilities:
                            type: string
        default:
          $ref: '#/components/responses/Problem'
  /admin/providers:
    get:
      operationId: listProviders
      summary: List provider keys, cooldowns and the last 24 hours of usage
      security:
      - adminKey: []
      x-required-roles: &id002
      - administrator
      - operator
      - auditor
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderSummary'
        default:
          $ref: '#/components/responses/Problem'
  /admin/providers/{provider}/keys:
    post:
      operationId: addProviderKey
      summary: Store an encrypted upstream API key
      security:
      - adminKey: []
      x-required-roles: &id001
      - administrator
      description: Requires a configured encryption key. Adds to the configured pool, up to 64 keys including disabled
        credentials. Duplicate keys return 409. Changes propagate across replicas.
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProviderKey'
      responses:
        '204':
          description: Successful response
        default:
          $ref: '#/components/responses/Problem'
  /admin/providers/{provider}/keys/{keyId}:
    put:
      operationId: updateProviderKey
      summary: Enable, disable or label a provider credential
      security:
      - adminKey: []
      x-required-roles: *id001
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      - name: keyId
        in: path
        required: true
        schema:
          type: string
          pattern: ^key_[0-9a-f]{32}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderKey'
      responses:
        '204':
          description: Successful response
        default:
          $ref: '#/components/responses/Problem'
  /admin/providers/{provider}/check:
    post:
      operationId: checkProviderAccess
      summary: Optionally check credential and model access
      security:
      - adminKey: []
      x-required-roles: *id001
      description: Disabled by default; returns 409 until LiveChecksEnabled is configured. Limited to two checks
        per minute per account. Empty object discovers models. A configured upstream model triggers a small generation
        call for each enabled key and may incur provider charges. No production cooldown changes or gateway quota
        accounting.
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCheckRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderCheckResult'
        default:
          $ref: '#/components/responses/Problem'
  /admin/alerts:
    get:
      operationId: listAlerts
      summary: List durable operational incidents
      security:
      - adminKey: []
      x-required-roles: *id002
      parameters:
      - name: resolved
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperationalAlert'
        default:
          $ref: '#/components/responses/Problem'
  /admin/alerts/settings:
    get:
      operationId: alertSettings
      summary: Read alert thresholds without webhook credentials
      security:
      - adminKey: []
      x-required-roles: *id002
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSettings'
        default:
          $ref: '#/components/responses/Problem'
  /admin/alerts/evaluate:
    post:
      operationId: evaluateAlerts
      summary: Evaluate alert conditions without sending webhooks
      security:
      - adminKey: []
      x-required-roles: *id001
      responses:
        '204':
          description: Successful response
        default:
          $ref: '#/components/responses/Problem'
  /admin/alerts/{id}/acknowledge:
    post:
      operationId: acknowledgeAlert
      summary: Acknowledge an incident and suppress pending delivery
      security:
      - adminKey: []
      x-required-roles:
      - administrator
      - operator
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Successful response
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    gatewayKey:
      type: http
      scheme: bearer
      bearerFormat: Gateway API key
    adminKey:
      type: http
      scheme: bearer
      bearerFormat: Local operator session or separate LLMPROXY_ADMIN_KEY bootstrap secret
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from the previous page; URL-encode without modification
  responses:
    OpenAiError:
      description: Sanitized OpenAI-compatible error
      headers:
        X-Request-Id:
          schema: { type: string }
        Retry-After:
          description: Seconds until admission may be available; sent for gateway RPM and concurrency denials.
          schema: { type: integer }
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [message, type, param, code]
                properties:
                  message: { type: string }
                  type: { type: string }
                  param: { type: [string, 'null'] }
                  code: { type: string }
    Problem:
      description: RFC 7807 problem details
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              code: { type: string }
              request_id: { type: string }
    Health:
      description: Local dependency health; never performs a paid LLM request
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [Healthy, Degraded, Unhealthy] }
              checks:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    status: { type: string }
                    description: { type: [string, 'null'] }
  schemas:
    AddProviderKey:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 8192
          writeOnly: true
        label:
          type: string
          maxLength: 128
          default: ''
      required:
      - key
    UpdateProviderKey:
      type: object
      properties:
        enabled:
          type: boolean
        label:
          type: string
          maxLength: 128
          default: ''
      required:
      - enabled
    ProviderKeySummary:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        source:
          type: string
          enum:
          - configuration
          - managed
        enabled:
          type: boolean
        cooldown_until:
          type: string
          format: date-time
        attempts:
          type: integer
          format: int64
        failures:
          type: integer
          format: int64
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        cost:
          type: number
        average_latency_ms:
          type: number
    ProviderSummary:
      type: object
      properties:
        name:
          type: string
        adapter:
          type: string
        endpoint:
          type: string
        configured:
          type: boolean
        key_management_available:
          type: boolean
        live_checks_enabled:
          type: boolean
        cooldown_seconds:
          type: integer
          format: int64
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ProviderKeySummary'
    ProviderCheckRequest:
      type: object
      properties:
        model:
          type:
          - string
          - 'null'
          description: Optional configured upstream model; omission selects model discovery.
    ProviderCheckResult:
      type: object
      properties:
        key_id:
          type: string
        success:
          type: boolean
        code:
          type: string
        http_status:
          type: integer
        latency_ms:
          type: integer
          format: int64
        models:
          type: array
          items:
            type: string
    AlertSettings:
      type: object
      properties:
        enabled:
          type: boolean
        evaluation_seconds:
          type: integer
          format: int64
        window_minutes:
          type: integer
          format: int64
        minimum_attempts:
          type: integer
          format: int64
        budget_percent:
          type: number
        error_percent:
          type: number
        average_latency_ms:
          type: number
        webhook_configured:
          type: boolean
    OperationalAlert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fingerprint:
          type: string
        kind:
          type: string
          enum:
          - budget
          - error_spike
          - high_latency
          - pool_exhausted
        resource:
          type: string
        severity:
          type: string
          enum:
          - warning
          - critical
        message:
          type: string
        started_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        acknowledged_at:
          type: string
          format: date-time
        acknowledged_by:
          type: string
        occurrences:
          type: integer
          format: int64
        delivered_at:
          type: string
          format: date-time
        delivery_lease_until:
          type: string
          format: date-time
        delivery_attempts:
          type: integer
          format: int64
        next_delivery_at:
          type: string
          format: date-time
    Message:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [system, developer, user, assistant, tool] }
        content:
          oneOf:
            - type: [string, 'null']
            - type: array
              items:
                oneOf:
                  - { $ref: '#/components/schemas/TextPart' }
                  - { $ref: '#/components/schemas/ImagePart' }
                  - { $ref: '#/components/schemas/AudioPart' }
        name: { type: string, maxLength: 64 }
        reasoning_content:
          type: [string, 'null']
          description: Optional assistant reasoning history, preserved for DeepSeek and stripped when forwarding to other adapters. Also emitted in DeepSeek streaming deltas. Never logged.
        tool_call_id: { type: string }
        tool_calls:
          type: array
          items: { $ref: '#/components/schemas/ToolCall' }
    ToolCall:
      type: object
      required: [id, type, function]
      properties:
        id: { type: string }
        type: { type: string, const: function }
        function:
          type: object
          required: [name, arguments]
          properties:
            name: { type: string }
            arguments: { type: string, description: JSON-encoded function arguments }
        extra_content: { type: object, description: Opaque provider metadata to preserve in tool history }
    ChatRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model: { type: string, minLength: 1, maxLength: 128 }
        messages:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Message' }
        stream: { type: boolean, default: false }
        stream_options:
          type: [object, 'null']
          properties:
            include_usage: { type: boolean, default: false }
        max_tokens: { type: [integer, 'null'], minimum: 1 }
        max_completion_tokens: { type: [integer, 'null'], minimum: 1 }
        temperature: { type: [number, 'null'], minimum: 0, maximum: 2 }
        top_p: { type: [number, 'null'], minimum: 0, maximum: 1 }
        stop:
          oneOf:
            - type: [string, 'null']
            - type: array
              maxItems: 4
              items: { type: string }
        n: { type: [integer, 'null'], enum: [1, null] }
        tools:
          type: [array, 'null']
          maxItems: 128
          items:
            type: object
            required: [type, function]
            properties:
              type: { type: string, const: function }
              function:
                type: object
                required: [name]
                properties:
                  name: { type: string, maxLength: 64 }
                  description: { type: [string, 'null'] }
                  parameters: { type: [object, 'null'] }
                  strict: { type: [boolean, 'null'] }
        tool_choice:
          oneOf:
            - type: string
              enum: [auto, none, required]
            - type: object
              properties:
                type: { type: string, const: function }
                function:
                  type: object
                  properties:
                    name: { type: string }
            - type: 'null'
        parallel_tool_calls: { type: [boolean, 'null'] }
        response_format: { type: [object, 'null'] }
        seed: { type: [integer, 'null'] }
        user: { type: [string, 'null'] }
        reasoning_effort: { type: [string, 'null'], enum: [none, minimal, low, medium, high, xhigh, null] }
        thinking_budget_tokens: { type: [integer, 'null'], minimum: 1024, description: Must be below the output cap and used without reasoning_effort. Anthropic/Gemini only. }
    TokenUsage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        prompt_tokens_details:
          type: object
          properties:
            cached_tokens: { type: integer, minimum: 0 }
            cache_creation_tokens: { type: integer, minimum: 0 }
    ChatCompletion:
      type: object
      required: [id, object, created, model, choices, usage]
      properties:
        id: { type: string }
        object: { type: string, const: chat.completion }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index: { type: integer, const: 0 }
              message: { $ref: '#/components/schemas/Message' }
              finish_reason: { type: string }
        usage: { $ref: '#/components/schemas/TokenUsage' }
    KeyPolicy:
      type: object
      required: [allowed_models]
      properties:
        allowed_models:
          type: array
          minItems: 1
          items: { type: string }
        requests_per_minute: { type: integer, minimum: 1, maximum: 1000000, default: 60 }
        token_limit: { type: [integer, 'null'], minimum: 0 }
        spending_budget: { type: [number, 'null'], minimum: 0, maximum: 1000000 }
        expires_at: { type: [string, 'null'], format: date-time }
        monthly_token_limit: { type: [integer, 'null'], minimum: 0 }
        monthly_spending_budget: { type: [number, 'null'], minimum: 0, maximum: 1000000 }
    ApiKeySummary:
      allOf:
        - $ref: '#/components/schemas/KeyPolicy'
        - type: object
          properties:
            id: { type: string, format: uuid }
            prefix: { type: string }
            owner: { type: string }
            enabled: { type: boolean }
            used_tokens: { type: integer }
            reserved_tokens: { type: integer }
            spent: { type: number }
            reserved_cost: { type: number }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            last_used_at: { type: [string, 'null'], format: date-time }
    UsageRecord:
      type: object
      properties:
        operation: { type: string, enum: [chat, embeddings, responses] }
        request_id: { type: string, format: uuid }
        api_key_id: { type: string, format: uuid }
        model: { type: string }
        provider: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        total_tokens: { type: integer }
        latency_ms: { type: integer }
        status: { type: string, enum: [success, error, cancelled, abandoned] }
        error_code: { type: [string, 'null'] }
        estimated_cost: { type: number }
        usage_estimated: { type: boolean }
        created_at: { type: string, format: date-time }
    TextPart:
      type: object
      required:
      - type
      - text
      properties:
        type:
          type: string
          const: text
        text:
          type: string
    ImagePart:
      type: object
      required:
      - type
      - image_url
      properties:
        type:
          type: string
          const: image_url
        image_url:
          type: object
          required:
          - url
          properties:
            url:
              type: string
              description: HTTPS URL or a PNG/JPEG/WebP/GIF base64 data URL
            detail:
              type: string
              enum:
              - auto
              - low
              - high
    AudioPart:
      type: object
      required:
      - type
      - input_audio
      properties:
        type:
          type: string
          const: input_audio
        input_audio:
          type: object
          required:
          - data
          - format
          properties:
            data:
              type: string
              contentEncoding: base64
            format:
              type: string
              enum:
              - wav
              - mp3
    EmbeddingRequest:
      type: object
      required:
      - model
      - input
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 128
        input:
          oneOf:
          - type: string
            minLength: 1
          - type: array
            items:
              type: string
              minLength: 1
            minItems: 1
            maxItems: 2048
          - type: array
            items:
              type: integer
              minimum: 0
            minItems: 1
            maxItems: 8192
          - type: array
            items:
              type: array
              items:
                type: integer
                minimum: 0
              minItems: 1
              maxItems: 8192
            minItems: 1
            maxItems: 2048
        dimensions:
          type: integer
          minimum: 1
          maximum: 65536
        encoding_format:
          type: string
          enum:
          - float
          - base64
          default: float
        user:
          type: string
      additionalProperties: false
    EmbeddingList:
      type: object
      required:
      - object
      - model
      - data
      - usage
      properties:
        object:
          type: string
          const: list
        model:
          type: string
        data:
          type: array
          items:
            type: object
            required:
            - object
            - index
            - embedding
            properties:
              object:
                type: string
                const: embedding
              index:
                type: integer
                minimum: 0
              embedding:
                oneOf:
                - type: array
                  items:
                    type: number
                - type: string
                  contentEncoding: base64
        usage:
          type: object
          required:
          - prompt_tokens
          - total_tokens
          properties:
            prompt_tokens:
              type: integer
              minimum: 0
            total_tokens:
              type: integer
              minimum: 0
    ResponseContentPart:
      oneOf:
      - type: object
        required:
        - type
        - text
        properties:
          type:
            type: string
            enum:
            - input_text
            - output_text
          text:
            type: string
      - type: object
        required:
        - type
        - image_url
        properties:
          type:
            type: string
            const: input_image
          image_url:
            type: string
            description: HTTPS or base64 image data URL; file_id is unsupported
          detail:
            type: string
            enum:
            - auto
            - low
            - high
    ResponseInputItem:
      oneOf:
      - type: object
        required:
        - role
        - content
        properties:
          type:
            type: string
            const: message
          role:
            type: string
            enum:
            - user
            - assistant
            - system
            - developer
          content:
            oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ResponseContentPart'
              minItems: 1
      - type: object
        required:
        - type
        - call_id
        - name
        - arguments
        properties:
          type:
            type: string
            const: function_call
          call_id:
            type: string
          name:
            type: string
          arguments:
            type: string
          id:
            type: string
      - type: object
        required:
        - type
        - call_id
        - output
        properties:
          type:
            type: string
            const: function_call_output
          call_id:
            type: string
          output:
            oneOf:
            - type: string
            - type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ResponseContentPart'
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            const: reasoning
          id:
            type: string
          summary:
            type: array
            items:
              type: object
          encrypted_content:
            type: string
    ResponseFunctionTool:
      type: object
      required:
      - type
      - name
      properties:
        type:
          type: string
          const: function
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
        parameters:
          type: object
        strict:
          type: boolean
    ResponseRequest:
      type: object
      required:
      - model
      - input
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 128
        input:
          oneOf:
          - type: string
            minLength: 1
          - type: array
            items:
              $ref: '#/components/schemas/ResponseInputItem'
            minItems: 1
            maxItems: 256
        instructions:
          type: string
        stream:
          type: boolean
          default: false
        max_output_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
          minimum: 0
          maximum: 2
        top_p:
          type: number
          minimum: 0
          maximum: 1
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ResponseFunctionTool'
          maxItems: 128
        tool_choice:
          oneOf:
          - type: string
            enum:
            - auto
            - none
            - required
          - type: object
            required:
            - type
            - name
            properties:
              type:
                type: string
                const: function
              name:
                type: string
        parallel_tool_calls:
          type: boolean
        text:
          type: object
          properties:
            format:
              type: object
              required:
              - type
              properties:
                type:
                  type: string
                  enum:
                  - text
                  - json_object
                  - json_schema
                name:
                  type: string
                schema:
                  type: object
                strict:
                  type: boolean
            verbosity:
              type: string
              enum:
              - low
              - medium
              - high
        reasoning:
          type: object
          properties:
            effort:
              type: string
              enum:
              - none
              - minimal
              - low
              - medium
              - high
              - xhigh
            summary:
              type: string
        store:
          type: boolean
          const: false
          default: false
        background:
          type: boolean
          const: false
        include:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        truncation:
          type: string
          enum:
          - auto
          - disabled
        user:
          type: string
        safety_identifier:
          type: string
        prompt_cache_key:
          type: string
      additionalProperties: false
      description: Stateless Responses only. Stored responses, previous_response_id, conversations, item/file references,
        hosted tools and background execution are unsupported. Upstream model restrictions still apply.
    Response:
      type: object
      required:
      - id
      - object
      - model
      - output
      properties:
        id:
          type: string
        object:
          type: string
          const: response
        created_at:
          type: integer
        model:
          type: string
        status:
          type: string
        output:
          type: array
          items:
            type: object
            additionalProperties: true
        usage:
          type:
          - object
          - 'null'
          properties:
            input_tokens:
              type: integer
              minimum: 0
            output_tokens:
              type: integer
              minimum: 0
            total_tokens:
              type: integer
              minimum: 0
            input_tokens_details:
              type: object
            output_tokens_details:
              type: object
      additionalProperties: true
      description: Native provider response items with the public model alias. Other native response fields are preserved.
    GatewayFile:
      type: object
      required:
      - id
      - object
      - bytes
      - created_at
      - filename
      - purpose
      - status
      properties:
        id:
          type: string
        object:
          type: string
          const: file
        bytes:
          type: integer
          minimum: 0
        created_at:
          type: integer
          description: Unix seconds
        filename:
          type: string
        purpose:
          type: string
          enum:
