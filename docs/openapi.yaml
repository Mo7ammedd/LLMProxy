    Operator:
      type: object
      required:
      - id
      - username
      - role
      - enabled
      - created_at
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum:
          - administrator
          - operator
          - auditor
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    CreateOperator:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._@-]+$
        password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
        role:
          type: string
          enum:
          - administrator
          - operator
          - auditor
          default: operator
    UpdateOperator:
      type: object
      required:
      - enabled
      - role
      properties:
        enabled:
          type: boolean
        role:
          type: string
          enum:
          - administrator
          - operator
          - auditor
        password:
          type:
          - string
          - 'null'
          minLength: 12
          maxLength: 1024
          writeOnly: true
    OperatorLogin:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
    OperatorSession:
      type: object
      required:
      - token
      - expires_at
      - operator
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        operator:
          $ref: '#/components/schemas/Operator'
    CreatedApiKey:
      type: object
      required:
      - key
      - details
      properties:
        key:
          type: string
          pattern: ^llmp_sk_[A-Za-z0-9_-]+$
        details:
          $ref: '#/components/schemas/ApiKeySummary'
    QuotaWindow:
      type: object
      properties:
        id:
          type: string
        api_key_id:
          type: string
          format: uuid
        period:
          type: string
          pattern: ^\d{4}-\d{2}$
        used_tokens:
          type: integer
        reserved_tokens:
          type: integer
        spent_units:
          type: integer
          description: Nano-USD; 1,000,000,000 units equal USD 1
        reserved_units:
          type: integer
          description: Nano-USD
    UsageRollup:
      type: object
      properties:
        model:
          type: string
