      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UsageRecord'
        next_cursor:
          type:
          - string
          - 'null'
      description: Pass next_cursor unchanged as the URL-encoded cursor parameter. Its absence or null ends pagination.
    KeyPage:
