        endpoint:
          type: string
        input_file_id:
          type: string
        completion_window:
          type: string
          const: 24h
        status:
          type: string
          enum:
          - in_progress
          - cancelling
          - completed
          - cancelled
          - expired
        created_at:
          type: integer
        in_progress_at:
          type: integer
        expires_at:
          type: integer
        completed_at:
          type:
          - integer
          - 'null'
        cancelled_at:
          type:
          - integer
          - 'null'
        expired_at:
          type:
          - integer
          - 'null'
        output_file_id:
          type:
          - string
          - 'null'
        error_file_id:
          type:
          - string
          - 'null'
        metadata:
          type: object
        request_counts:
          type: object
          required:
          - total
