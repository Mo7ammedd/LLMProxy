        endpoint:
          type: string
          enum:
          - /v1/chat/completions
          - /v1/embeddings
          - /v1/responses
        completion_window:
          type: string
          const: 24h
        metadata:
          type: object
          maxProperties: 16
          propertyNames:
            maxLength: 64
          additionalProperties:
            type: string
            maxLength: 512
    Batch:
      type: object
