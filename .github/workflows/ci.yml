name: Build, test and publish

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: llmproxy_ci_fixture_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      LLMPROXY_TEST_POSTGRES: Host=127.0.0.1;Database=postgres;Username=postgres;Password=llmproxy_ci_fixture_password
      LLMPROXY_TEST_REDIS: 127.0.0.1:6379,abortConnect=false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          version = ET.parse("Directory.Build.props").findtext(".//Version")
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Release tag must match Directory.Build.props Version"
          PY
      - run: python3 -m unittest discover -s scripts/tests
      - run: dotnet restore --locked-mode
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --no-restore --logger "trx;LogFilePrefix=results" --results-directory artifacts/test-results
      - name: Install recovery drill tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Load, multi-instance failure and PostgreSQL restoration drill
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: llmproxy_ci_fixture_password
        run: python3 scripts/recovery_drill.py --duration 60 --long-stream-seconds 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: recovery-drill
          path: artifacts/recovery-drill.json

  runtime-arm64:
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r examples/python/requirements.txt
      - run: npm ci --prefix examples/typescript --ignore-scripts
      - run: dotnet restore examples/csharp --locked-mode
      - run: dotnet build examples/csharp --configuration Release --no-restore
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ARM64 runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: llmproxy:smoke
      - name: Run container and SDK checks on ARM64
        run: python scripts/docker_smoke.py
      - run: mkdir -p artifacts/security
      - name: Scan native arm64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: llmproxy:smoke
          scanners: vuln
          format: json
          output: artifacts/security/scan-arm64.json
          exit-code: '0'
          timeout: 10m
      - name: Enforce vulnerability policy
        run: python3 scripts/check_vulnerabilities.py artifacts/security/scan-arm64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-native-arm64
          path: artifacts/security/scan-arm64.json

  image:
    needs: [verify, runtime-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Require Docker Hub publication settings
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Set the DOCKERHUB_USERNAME repository variable and DOCKERHUB_TOKEN Actions secret."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/typescript/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: examples/python/requirements.txt
      - run: pip install -r examples/python/requirements.txt
      - run: npm ci --prefix examples/typescript --ignore-scripts
      - run: dotnet restore examples/csharp --locked-mode
      - run: dotnet build examples/csharp --configuration Release --no-restore
      - run: dotnet restore src/LLMProxy.Server --locked-mode
      - run: dotnet build src/LLMProxy.Server --configuration Release --no-restore
      - name: Source and extended OpenAI SDK compatibility
        run: python scripts/source_smoke.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: llmproxy:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker and OpenAI SDK integration tests
        run: python scripts/docker_smoke.py
      - run: mkdir -p artifacts/security
      - name: Scan native amd64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: llmproxy:smoke
          scanners: vuln
          format: json
          output: artifacts/security/scan-amd64.json
          exit-code: '0'
          timeout: 10m
      - name: Enforce vulnerability policy
        run: python3 scripts/check_vulnerabilities.py artifacts/security/scan-amd64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-native-amd64
          path: artifacts/security/scan-amd64.json
      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) }}
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-
      - name: Docker Hub image tags
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: dockerhub-metadata
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/llmproxy
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish verified image
        if: github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          attests: type=sbom,generator=docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          tags: |
            ${{ steps.metadata.outputs.tags }}
            ${{ steps.dockerhub-metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify both registry manifests
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          GHCR_IMAGE: ${{ steps.image.outputs.name }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/llmproxy
        run: |
          docker buildx imagetools inspect "$GHCR_IMAGE@$IMAGE_DIGEST" --raw > ghcr-index.json
          docker buildx imagetools inspect "$DOCKERHUB_IMAGE@$IMAGE_DIGEST" --raw > dockerhub-index.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          expected = os.environ["IMAGE_DIGEST"]
          for registry in ("ghcr", "dockerhub"):
              raw = Path(f"{registry}-index.json").read_bytes()
              assert "sha256:" + hashlib.sha256(raw).hexdigest() == expected, f"Unexpected {registry} digest"
              platforms = {(m.get("platform", {}).get("os"), m.get("platform", {}).get("architecture")) for m in json.loads(raw)["manifests"]}
              assert {("linux", "amd64"), ("linux", "arm64")} <= platforms, f"Missing {registry} platform"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Verified Linux AMD64 and ARM64 in both registries.\n\nDigest: `{expected}`\n\n")
              for variable in ("DOCKERHUB_IMAGE", "GHCR_IMAGE"):
                  summary.write(f"- `{os.environ[variable]}@{expected}`\n")
          PY
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Scan, sign and verify published digests
        if: github.event_name != 'pull_request'
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          GHCR_IMAGE: ${{ steps.image.outputs.name }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/llmproxy
        run: bash scripts/release_evidence.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request' && always()
        with:
          name: security-release
          path: artifacts/security/
      - name: Synchronize Docker Hub overview
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python scripts/publish_dockerhub_overview.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: security-release
          path: artifacts/security
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; preserving its notes."
            exit 0
          fi
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_flags+=(--prerelease); fi
          release_version="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          Linux AMD64 and ARM64 images passed gateway, database, recovery, native container/SDK and vulnerability checks. Both registry digests have verified Sigstore signatures and scan attestations; SPDX SBOMs, build provenance and full scan reports are attached.

          - Docker Hub: \`$DOCKERHUB_USERNAME/llmproxy:$release_version\`
          - GHCR: \`ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME\`
          - Verified image digest in both registries: \`$IMAGE_DIGEST\`

          [Signature verification and scan policy](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/releases.md#signatures-sboms-and-vulnerability-policy)

          [Changelog and upgrade notes](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md) · [Deployment documentation](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md)
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "LLMProxy $GITHUB_REF_NAME" --notes-file release-notes.md --generate-notes "${release_flags[@]}" artifacts/security/*
